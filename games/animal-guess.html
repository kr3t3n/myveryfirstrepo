<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Guess - Arcade</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            padding: 20px;
        }

        .game-container {
            max-width: 600px;
            margin: 0 auto;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            text-decoration: none;
            transition: background 0.2s;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .game-header {
            text-align: center;
            background: linear-gradient(145deg, #1e1e30, #2a2a40);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            font-size: 0.95rem;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 15px;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #48dbfb;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #666;
        }

        .input-section {
            background: linear-gradient(145deg, #1e1e30, #2a2a40);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        #guess-input {
            flex: 1;
            padding: 15px;
            font-size: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            outline: none;
            transition: border-color 0.2s;
        }

        #guess-input:focus {
            border-color: #48dbfb;
        }

        #guess-input::placeholder {
            color: #666;
        }

        .guess-btn {
            padding: 15px 25px;
            font-size: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .guess-btn:hover:not(:disabled) {
            transform: scale(1.05);
        }

        .guess-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .suggestions {
            position: relative;
        }

        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #2a2a40;
            border-radius: 12px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            margin-top: 5px;
            display: none;
        }

        .suggestions-list.show {
            display: block;
        }

        .suggestion-item {
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s;
        }

        .suggestion-item:hover {
            background: rgba(72, 219, 251, 0.2);
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .taxonomy-tree {
            background: linear-gradient(145deg, #1e1e30, #2a2a40);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .taxonomy-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #888;
        }

        .taxonomy-level {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            margin: 5px 0;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
            transition: all 0.3s;
        }

        .taxonomy-level.revealed {
            background: rgba(72, 219, 251, 0.2);
            border-left: 4px solid #48dbfb;
        }

        .taxonomy-level.match {
            background: rgba(76, 175, 80, 0.2);
            border-left: 4px solid #4CAF50;
        }

        .level-name {
            width: 80px;
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
        }

        .level-value {
            flex: 1;
            font-weight: 500;
        }

        .level-value.hidden {
            color: #555;
        }

        .guesses-section {
            background: linear-gradient(145deg, #1e1e30, #2a2a40);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .guesses-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #888;
        }

        .guess-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            margin: 8px 0;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
        }

        .guess-animal {
            font-weight: 500;
        }

        .guess-match {
            font-size: 0.85rem;
            padding: 5px 12px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.1);
        }

        .guess-match.high {
            background: rgba(76, 175, 80, 0.3);
            color: #4CAF50;
        }

        .guess-match.medium {
            background: rgba(254, 202, 87, 0.3);
            color: #feca57;
        }

        .guess-match.low {
            background: rgba(255, 107, 107, 0.3);
            color: #ff6b6b;
        }

        .game-over {
            text-align: center;
            padding: 30px;
            background: linear-gradient(145deg, #1e1e30, #2a2a40);
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .game-over h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .game-over.win h2 {
            color: #4CAF50;
        }

        .game-over.lose h2 {
            color: #ff6b6b;
        }

        .game-over p {
            color: #888;
            margin-bottom: 20px;
        }

        .answer-reveal {
            font-size: 1.3rem;
            color: #48dbfb;
            margin: 15px 0;
        }

        .new-game-btn {
            padding: 15px 30px;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .new-game-btn:hover {
            transform: scale(1.05);
        }

        .hidden {
            display: none !important;
        }

        /* Mobile responsive */
        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }

            .input-wrapper {
                flex-direction: column;
            }

            .guess-btn {
                width: 100%;
            }

            .stats {
                gap: 20px;
            }

            .level-name {
                width: 60px;
                font-size: 0.75rem;
            }

            .taxonomy-level {
                padding: 8px 12px;
            }
        }
    </style>
</head>

        let revealedLevels = new Set();
        let gameOver = false;
        let streak = parseInt(localStorage.getItem('animalGuessStreak') || '0');

        const input = document.getElementById('guess-input');
        const guessBtn = document.getElementById('guess-btn');
        const suggestionsList = document.getElementById('suggestions');
        const guessesListEl = document.getElementById('guesses-list');
        const guessesLeftEl = document.getElementById('guesses-left');
        const streakEl = document.getElementById('streak');
        const gameOverEl = document.getElementById('game-over');
        const gameOverTitle = document.getElementById('game-over-title');
        const gameOverMessage = document.getElementById('game-over-message');
        const answerReveal = document.getElementById('answer-reveal');
        const newGameBtn = document.getElementById('new-game-btn');
        const inputSection = document.getElementById('input-section');

        function init() {
            targetAnimal = animals[Math.floor(Math.random() * animals.length)];
            guessesLeft = 10;
            guesses = [];
            revealedLevels = new Set();
            gameOver = false;

            guessesLeftEl.textContent = guessesLeft;
            streakEl.textContent = streak;
            guessesListEl.innerHTML = '';
            gameOverEl.classList.add('hidden');
            inputSection.classList.remove('hidden');
            input.value = '';
            input.disabled = false;
            guessBtn.disabled = false;

            // Reset taxonomy display
            taxonomyLevels.forEach(level => {
                const levelEl = document.getElementById(`level-${level}`);
                const valEl = document.getElementById(`val-${level}`);
                levelEl.classList.remove('revealed', 'match');
                valEl.textContent = '???';
                valEl.classList.add('hidden');
            });

            // Always reveal kingdom (all animals share it)
            revealLevel('kingdom');
        }

        function revealLevel(level) {
            if (revealedLevels.has(level)) return;
            revealedLevels.add(level);

            const levelEl = document.getElementById(`level-${level}`);
            const valEl = document.getElementById(`val-${level}`);

            levelEl.classList.add('revealed');
            valEl.textContent = targetAnimal[level];
            valEl.classList.remove('hidden');
        }

        function getMatchLevel(guessedAnimal) {
            let matchLevel = 0;
            for (let i = 0; i < taxonomyLevels.length; i++) {
                const level = taxonomyLevels[i];
                if (guessedAnimal[level] === targetAnimal[level]) {
                    matchLevel = i + 1;
                    revealLevel(level);
                } else {
                    break;
                }
            }
            return matchLevel;
        }

        function getMatchText(level) {
            if (level === 0) return "No match";
            return `Matches ${taxonomyLevels[level - 1]}`;
        }

        function getMatchClass(level) {
            if (level >= 5) return 'high';
            if (level >= 3) return 'medium';
            return 'low';
        }

        function makeGuess(animalName) {
            if (gameOver || guessesLeft <= 0) return;

            const guessedAnimal = animals.find(a => a.name.toLowerCase() === animalName.toLowerCase());
            if (!guessedAnimal) {
                alert('Animal not in database. Try another!');
                return;
            }

            if (guesses.some(g => g.name.toLowerCase() === animalName.toLowerCase())) {
                alert('You already guessed that animal!');
                return;
            }

            guessesLeft--;
            guessesLeftEl.textContent = guessesLeft;

            const matchLevel = getMatchLevel(guessedAnimal);
            guesses.push({ name: guessedAnimal.name, matchLevel });

            // Add to guesses list
            const guessEl = document.createElement('div');
            guessEl.className = 'guess-item';
            guessEl.innerHTML = `
                <span class="guess-animal">${guessedAnimal.name}</span>
                <span class="guess-match ${getMatchClass(matchLevel)}">${getMatchText(matchLevel)}</span>
            `;
            guessesListEl.insertBefore(guessEl, guessesListEl.firstChild);

            // Check win
            if (guessedAnimal.name === targetAnimal.name) {
                endGame(true);
                return;
            }

            // Check lose
            if (guessesLeft <= 0) {
                endGame(false);
            }

            input.value = '';
            suggestionsList.classList.remove('show');
        }

        function endGame(won) {
            gameOver = true;
            input.disabled = true;
            guessBtn.disabled = true;
            inputSection.classList.add('hidden');

            // Reveal all taxonomy
            taxonomyLevels.forEach(level => revealLevel(level));

            if (won) {
                streak++;
                localStorage.setItem('animalGuessStreak', streak);
                streakEl.textContent = streak;
                gameOverEl.classList.remove('lose');
                gameOverEl.classList.add('win');
                gameOverTitle.textContent = 'You Won!';
                gameOverMessage.textContent = `You guessed it in ${10 - guessesLeft} ${10 - guessesLeft === 1 ? 'try' : 'tries'}!`;
            } else {
                streak = 0;
                localStorage.setItem('animalGuessStreak', '0');
                streakEl.textContent = streak;
                gameOverEl.classList.remove('win');
                gameOverEl.classList.add('lose');
                gameOverTitle.textContent = 'Game Over';
                gameOverMessage.textContent = 'You ran out of guesses!';
            }

            answerReveal.textContent = `The answer was: ${targetAnimal.name}`;
            gameOverEl.classList.remove('hidden');
        }

        // Input handling
        input.addEventListener('input', () => {
            const value = input.value.toLowerCase().trim();
            if (value.length < 1) {
                suggestionsList.classList.remove('show');
                return;
            }

            const matches = animals
                .filter(a => a.name.toLowerCase().includes(value))
                .filter(a => !guesses.some(g => g.name.toLowerCase() === a.name.toLowerCase()))
                .slice(0, 5);

            if (matches.length === 0) {
                suggestionsList.classList.remove('show');
                return;
            }

            suggestionsList.innerHTML = matches
                .map(a => `<div class="suggestion-item" data-name="${a.name}">${a.name}</div>`)
                .join('');
            suggestionsList.classList.add('show');
        });

        suggestionsList.addEventListener('click', (e) => {
            if (e.target.classList.contains('suggestion-item')) {
                makeGuess(e.target.dataset.name);
            }
        });

        guessBtn.addEventListener('click', () => {
            if (input.value.trim()) {
                makeGuess(input.value.trim());
            }
        });

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && input.value.trim()) {
                makeGuess(input.value.trim());
            }
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.suggestions')) {
                suggestionsList.classList.remove('show');
            }
        });

        newGameBtn.addEventListener('click', init);

        // Start game
        init();
    </script>
</body>
</html>
